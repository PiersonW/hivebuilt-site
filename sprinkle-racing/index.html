<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sprinkle Sprint Racing</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #FFD6EC; }
  canvas { position: fixed; inset: 0; display: block; }
  #hud { pointer-events: none; }
  #err { position: fixed; left: 0; right: 0; bottom: 0; padding: 14px; background: #c0003a; color: #fff;
         font: 600 18px system-ui, sans-serif; display: none; z-index: 9; }
</style>
<script>
  // Lets Edge on Xbox hand the controller to the game instead of moving a mouse pointer.
  try { navigator.gamepadInputEmulation = 'gamepad'; } catch (e) {}
  window.addEventListener('error', function (e) { var b = document.getElementById('err'); if (b) { b.textContent = 'Something went wrong: ' + e.message; b.style.display = 'block'; } });
</script>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>
<div id="err"></div>
<script type="module">
import * as THREE from './three.module.min.js';

// ───────────────────────── Racers (same six as the phone game) ─────────────────────────
const RACERS = [
  { key: 'berry', name: 'Berry', kart: '#FF4F9A', trim: '#FFD1E6', skin: '#F7D1B5', hair: '#7A4A2A', bit: 'bow' },
  { key: 'minty', name: 'Minty', kart: '#2FD4A3', trim: '#D3FFF0', skin: '#E8B48F', hair: '#F2C94C', bit: 'headband' },
  { key: 'lemon', name: 'Lemon', kart: '#FFC83D', trim: '#FFF3C4', skin: '#FBE0CC', hair: '#D2532C', bit: 'star' },
  { key: 'plum', name: 'Plum', kart: '#9B5CFF', trim: '#E6D8FF', skin: '#A86B47', hair: '#2B1B14', bit: 'crown' },
  { key: 'sky', name: 'Sky', kart: '#3DA5FF', trim: '#D6ECFF', skin: '#C98E66', hair: '#3B2416', bit: 'flower' },
  { key: 'peach', name: 'Peach', kart: '#FF8A3D', trim: '#FFE1CC', skin: '#6E4128', hair: '#140C08', bit: 'heart' },
];
const P_COLORS = ['#FF2E88', '#2E8BFF', '#14B88A', '#F2A100'];
const PLACE = ['1st', '2nd', '3rd', '4th', '5th', '6th'];
const CPU_LEVELS = [{ name: 'Easy', speed: 0.74 }, { name: 'Medium', speed: 0.86 }, { name: 'Hard', speed: 0.97 }];
const TOTAL_KARTS = 6;

const TRACKS = [
  { name: 'Frosting Loop', ground: '#BDF0D6', road: '#FBC2DB', sky: '#BFE6FF', fog: '#FFE3F2',
    pts: [[0, 0], [110, 10], [190, -20], [230, -100], [190, -180], [100, -190], [60, -140], [0, -150], [-90, -210], [-180, -170], [-205, -80], [-150, -20], [-80, 15]] },
  { name: 'Gumdrop Canyon', ground: '#FFE2B3', road: '#DCC3FF', sky: '#FFD7C4', fog: '#FFEBDD',
    pts: [[0, 0], [90, 0], [160, 40], [225, 15], [245, -70], [185, -125], [120, -95], [60, -135], [45, -215], [-40, -245], [-125, -205], [-135, -125], [-205, -95], [-235, -10], [-170, 40], [-80, 30]] },
];

// ───────────────────────── Renderer ─────────────────────────
const gl = document.getElementById('gl');
const hud = document.getElementById('hud');
const ctx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas: gl, antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setScissorTest(true);
let SW = 0, SH = 0;
function resize() {
  SW = window.innerWidth; SH = window.innerHeight;
  renderer.setSize(SW, SH);
  hud.width = Math.round(SW * DPR); hud.height = Math.round(SH * DPR);
  hud.style.width = SW + 'px'; hud.style.height = SH + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// Cartoon shading. Toon materials skip the lighting lookup table that broke Vault Runner on Xbox.
const grad = new THREE.DataTexture(new Uint8Array([120, 195, 255]), 3, 1, THREE.RedFormat);
grad.minFilter = grad.magFilter = THREE.NearestFilter; grad.needsUpdate = true;
const toon = (color, extra = {}) => new THREE.MeshToonMaterial({ color, gradientMap: grad, ...extra });

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 4;
  return t;
}
function rng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const SPRINKLE = ['#FF4F9A', '#FFC83D', '#2FD4A3', '#3DA5FF', '#9B5CFF', '#FFFFFF'];
const sprinkleTex = (base, n, seed) => canvasTex(128, 128, (g, w, h) => {
  const r = rng(seed); g.fillStyle = base; g.fillRect(0, 0, w, h);
  for (let i = 0; i < n; i++) { g.save(); g.translate(r() * w, r() * h); g.rotate(r() * Math.PI); g.fillStyle = SPRINKLE[i % SPRINKLE.length]; g.fillRect(-5, -1.5, 10, 3); g.restore(); }
});
const stripeTex = canvasTex(64, 64, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#E8233F';
  for (let i = -2; i < 4; i++) { g.beginPath(); g.moveTo(i * 24, 0); g.lineTo(i * 24 + 12, 0); g.lineTo(i * 24 + 12 + h, h); g.lineTo(i * 24 + h, h); g.fill(); }
});
const swirlTex = canvasTex(128, 128, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.strokeStyle = '#B9B9B9'; g.lineWidth = 9; g.beginPath();
  for (let a = 0; a < Math.PI * 7; a += 0.1) { const r = a * 6.5; g.lineTo(64 + Math.cos(a) * r, 64 + Math.sin(a) * r); } g.stroke();
});
const checkTex = canvasTex(64, 16, (g) => { for (let x = 0; x < 16; x++) for (let y = 0; y < 4; y++) { g.fillStyle = (x + y) % 2 ? '#5B1A4A' : '#fff'; g.fillRect(x * 4, y * 4, 4, 4); } });
const arrowTex = canvasTex(64, 64, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.fillStyle = '#FFD23D'; g.strokeStyle = '#fff'; g.lineWidth = 4;
  for (const y of [8, 34]) { g.beginPath(); g.moveTo(8, y + 22); g.lineTo(32, y); g.lineTo(56, y + 22); g.lineTo(46, y + 22); g.lineTo(32, y + 10); g.lineTo(18, y + 22); g.closePath(); g.fill(); g.stroke(); }
});
const boxTex = canvasTex(64, 64, (g, w, h) => {
  const cols = ['#FF4F9A', '#FFC83D', '#2FD4A3', '#3DA5FF', '#9B5CFF'];
  cols.forEach((c, i) => { g.fillStyle = c; g.fillRect(0, i * 13, w, 13); });
  g.fillStyle = '#fff'; g.fillRect(27, 0, 10, h); g.fillRect(0, 27, w, 10);
  g.fillStyle = '#5B1A4A'; g.font = 'bold 30px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('?', 32, 34);
});

// ───────────────────────── Karts ─────────────────────────
function buildKart(r) {
  const root = new THREE.Group();
  const m = new THREE.Group(); root.add(m);
  const add = (geo, color, x, y, z, rx = 0, ry = 0, rz = 0) => { const o = new THREE.Mesh(geo, typeof color === 'string' ? toon(color) : color); o.position.set(x, y, z); o.rotation.set(rx, ry, rz); m.add(o); return o; };
  add(new THREE.BoxGeometry(2.4, 0.6, 3.4), r.kart, 0, 0.75, 0);
  add(new THREE.BoxGeometry(2.0, 0.45, 1.0), r.trim, 0, 0.65, 2.0);
  add(new THREE.BoxGeometry(1.7, 0.9, 0.3), r.kart, 0, 1.35, -1.0);
  add(new THREE.BoxGeometry(2.7, 0.15, 0.7), r.trim, 0, 1.65, -1.75);
  add(new THREE.BoxGeometry(0.2, 0.6, 0.2), r.kart, -0.9, 1.3, -1.75);
  add(new THREE.BoxGeometry(0.2, 0.6, 0.2), r.kart, 0.9, 1.3, -1.75);
  const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.45, 14);
  const hubGeo = new THREE.CylinderGeometry(0.24, 0.24, 0.47, 10);
  for (const [x, z] of [[-1.3, 1.15], [1.3, 1.15], [-1.3, -1.15], [1.3, -1.15]]) {
    add(wheelGeo, '#3A2235', x, 0.55, z, 0, 0, Math.PI / 2);
    add(hubGeo, r.trim, x, 0.55, z, 0, 0, Math.PI / 2);
  }
  add(new THREE.CylinderGeometry(0.42, 0.55, 0.8, 12), r.trim, 0, 1.4, -0.35);
  add(new THREE.SphereGeometry(0.55, 18, 14), r.skin, 0, 2.15, -0.25);
  const hair = add(new THREE.SphereGeometry(0.6, 18, 12, 0, Math.PI * 2, 0, Math.PI * 0.62), r.hair, 0, 2.2, -0.33, -0.35);
  hair.scale.set(1, 1, 1.02);
  add(new THREE.SphereGeometry(0.33, 12, 10), r.hair, 0, 2.05, -0.95);
  add(new THREE.SphereGeometry(0.08, 8, 6), '#2B1B14', -0.2, 2.22, 0.26);
  add(new THREE.SphereGeometry(0.08, 8, 6), '#2B1B14', 0.2, 2.22, 0.26);
  add(new THREE.SphereGeometry(0.1, 8, 6), '#FF8FB8', -0.32, 2.05, 0.2);
  add(new THREE.SphereGeometry(0.1, 8, 6), '#FF8FB8', 0.32, 2.05, 0.2);
  const top = 2.78;
  if (r.bit === 'bow') { add(new THREE.ConeGeometry(0.22, 0.45, 10), '#FF4F9A', -0.25, top - 0.05, -0.3, 0, 0, Math.PI / 2); add(new THREE.ConeGeometry(0.22, 0.45, 10), '#FF4F9A', 0.25, top - 0.05, -0.3, 0, 0, -Math.PI / 2); add(new THREE.SphereGeometry(0.12, 8, 6), '#FFFFFF', 0, top - 0.05, -0.3); }
  if (r.bit === 'crown') { add(new THREE.CylinderGeometry(0.34, 0.34, 0.26, 10, 1, true), toon('#FFC83D', { side: THREE.DoubleSide }), 0, top - 0.05, -0.25); for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; add(new THREE.ConeGeometry(0.08, 0.22, 6), '#FFC83D', Math.cos(a) * 0.32, top + 0.17, -0.25 + Math.sin(a) * 0.32); } }
  if (r.bit === 'star') add(new THREE.OctahedronGeometry(0.28), '#FFF07A', 0.4, top - 0.1, -0.2, 0.3, 0.6, 0);
  if (r.bit === 'flower') { for (let i = 0; i < 5; i++) { const a = (i / 5) * Math.PI * 2; add(new THREE.SphereGeometry(0.11, 8, 6), '#FFFFFF', 0.5, 2.55 + Math.sin(a) * 0.15, -0.2 + Math.cos(a) * 0.15); } add(new THREE.SphereGeometry(0.09, 8, 6), '#FFC83D', 0.55, 2.55, -0.2); }
  if (r.bit === 'heart') { add(new THREE.SphereGeometry(0.12, 8, 6), '#FF2E6E', 0.5, 2.62, -0.13); add(new THREE.SphereGeometry(0.12, 8, 6), '#FF2E6E', 0.5, 2.62, -0.33); add(new THREE.ConeGeometry(0.17, 0.25, 8), '#FF2E6E', 0.5, 2.46, -0.23, Math.PI, 0, 0); }
  if (r.bit === 'headband') add(new THREE.TorusGeometry(0.6, 0.07, 8, 24, Math.PI), r.trim, 0, 2.2, -0.2);
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(1.9, 20), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.06; root.add(shadow);
  return { root, model: m };
}

function nameTag(text, color) {
  const tex = canvasTex(128, 48, (g) => { g.fillStyle = color; g.beginPath(); g.roundRect(4, 4, 120, 40, 20); g.fill(); g.fillStyle = '#fff'; g.font = 'bold 28px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 64, 26); });
  // Same size on screen however close the kart is.
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthTest: false, sizeAttenuation: false }));
  s.scale.set(0.075, 0.028, 1); s.position.set(0, 3.9, 0); s.renderOrder = 5;
  return s;
}

// ───────────────────────── World ─────────────────────────
const N = 640;            // track samples
const HALF = 9;           // half road width
const WALL = HALF + 13;   // invisible fence from the center line
let scene, track; // track: { S, TG, NR, spacing, pads, boxes }
const garage = new THREE.Scene(); // used by the racer-pick screen and results

function setupLights(s, sky) {
  s.add(new THREE.HemisphereLight(0xffffff, new THREE.Color(sky).multiplyScalar(0.6), 1.6));
  const sun = new THREE.DirectionalLight(0xffffff, 1.4); sun.position.set(60, 120, 40); s.add(sun);
}
setupLights(garage, '#FFD6EC');
garage.background = new THREE.Color('#FFE3F2');

function buildWorld(def) {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(def.sky);
  scene.fog = new THREE.Fog(def.fog, 140, 460);
  setupLights(scene, def.sky);

  const curve = new THREE.CatmullRomCurve3(def.pts.map(([x, z]) => new THREE.Vector3(x, 0, z)), true, 'centripetal');
  const S = curve.getSpacedPoints(N); S.pop();
  const TG = [], NR = [];
  for (let i = 0; i < N; i++) {
    const t = S[(i + 1) % N].clone().sub(S[(i - 1 + N) % N]).normalize();
    TG.push(t); NR.push(new THREE.Vector3(t.z, 0, -t.x));
  }
  const spacing = curve.getLength() / N;
  track = { S, TG, NR, spacing, pads: [], boxes: [], def };

  // ground
  let minX = 1e9, maxX = -1e9, minZ = 1e9, maxZ = -1e9;
  for (const p of S) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); minZ = Math.min(minZ, p.z); maxZ = Math.max(maxZ, p.z); }
  track.bounds = { minX, maxX, minZ, maxZ };
  const gTex = sprinkleTex(def.ground, 14, 7); gTex.repeat.set(60, 60);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1600, 1600), toon('#ffffff', { map: gTex }));
  ground.rotation.x = -Math.PI / 2; ground.position.set((minX + maxX) / 2, -0.02, (minZ + maxZ) / 2); scene.add(ground);

  // road ribbon
  const ribbon = (o1, o2, y, vPer, material) => {
    const pos = [], uv = [], nrm = [], idx = [];
    for (let i = 0; i <= N; i++) {
      const s = S[i % N], n = NR[i % N], v = (i * spacing) / vPer;
      pos.push(s.x + n.x * o1, y, s.z + n.z * o1, s.x + n.x * o2, y, s.z + n.z * o2);
      uv.push(0, v, 1, v); nrm.push(0, 1, 0, 0, 1, 0);
      if (i < N) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nrm, 3));
    geo.setIndex(idx);
    const mesh = new THREE.Mesh(geo, material); scene.add(mesh); return mesh;
  };
  const roadTex = sprinkleTex(def.road, 22, 3);
  ribbon(-HALF, HALF, 0.02, HALF * 2, toon('#ffffff', { map: roadTex, side: THREE.DoubleSide }));
  // soft frosting shoulder that slows you down
  ribbon(HALF + 1.2, WALL, 0.01, 30, toon('#FFFFFF', { side: THREE.DoubleSide, transparent: true, opacity: 0.55 }));
  ribbon(-WALL, -HALF - 1.2, 0.01, 30, toon('#FFFFFF', { side: THREE.DoubleSide, transparent: true, opacity: 0.55 }));

  // candy-cane curbs
  const curbGeo = new THREE.BoxGeometry(1.2, 0.3, spacing * 1.05);
  const curbs = new THREE.InstancedMesh(curbGeo, toon('#ffffff'), N * 2);
  const dummy = new THREE.Object3D(); const red = new THREE.Color('#E8233F'), white = new THREE.Color('#ffffff');
  for (let i = 0, k = 0; i < N; i++) for (const side of [-1, 1]) {
    const s = S[i], n = NR[i]; dummy.position.set(s.x + n.x * (HALF + 0.6) * side, 0.12, s.z + n.z * (HALF + 0.6) * side);
    dummy.rotation.set(0, Math.atan2(TG[i].x, TG[i].z), 0); dummy.updateMatrix();
    curbs.setMatrixAt(k, dummy.matrix); curbs.setColorAt(k, Math.floor(i / 2) % 2 ? red : white); k++;
  }
  scene.add(curbs);

  // candy-cane fence posts along the outer edge
  const posts = [];
  for (let i = 0; i < N; i += 5) for (const side of [-1, 1]) posts.push(S[i].clone().addScaledVector(NR[i], (WALL + 0.5) * side));
  const postMesh = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.35, 0.35, 3.2, 8), toon('#ffffff', { map: stripeTex }), posts.length);
  posts.forEach((p, k) => { dummy.position.set(p.x, 1.6, p.z); dummy.rotation.set(0, 0, 0); dummy.updateMatrix(); postMesh.setMatrixAt(k, dummy.matrix); });
  scene.add(postMesh);

  // start line + donut arch
  const line = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, 3), toon('#ffffff', { map: checkTex }));
  // PlaneGeometry lies in XY: lay it flat, then turn it across the road
  line.position.set(S[0].x, 0.04, S[0].z); line.rotation.set(-Math.PI / 2, 0, 0); line.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), Math.atan2(TG[0].x, TG[0].z)); scene.add(line);
  const donut = new THREE.Mesh(new THREE.TorusGeometry(HALF + 4, 2.2, 14, 40), toon('#ffffff', { map: sprinkleTex('#FF7EB8', 40, 11) }));
  donut.position.set(S[0].x, 0, S[0].z); donut.rotation.y = Math.atan2(TG[0].x, TG[0].z); scene.add(donut);

  // boost pads
  const padMat = new THREE.MeshBasicMaterial({ map: arrowTex, transparent: true, depthWrite: false });
  for (const f of [0.12, 0.36, 0.6, 0.86]) {
    const i = Math.floor(N * f); const lat = (f * 100) % 2 < 1 ? -3 : 3;
    const p = new THREE.Mesh(new THREE.PlaneGeometry(5, 6), padMat);
    p.position.copy(S[i]).addScaledVector(NR[i], lat); p.position.y = 0.05;
    p.rotation.set(-Math.PI / 2, 0, 0); p.rotateOnWorldAxis(new THREE.Vector3(0, 1, 0), Math.atan2(TG[i].x, TG[i].z) + Math.PI);
    scene.add(p); track.pads.push({ i, lat });
  }

  // item boxes
  const boxGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8); const boxMat = toon('#ffffff', { map: boxTex });
  for (const f of [0.22, 0.5, 0.76]) {
    const i = Math.floor(N * f);
    for (const lat of [-6, -2, 2, 6]) {
      const b = new THREE.Mesh(boxGeo, boxMat); b.position.copy(S[i]).addScaledVector(NR[i], lat); b.position.y = 1.4;
      scene.add(b); track.boxes.push({ i, lat, mesh: b, back: 0 });
    }
  }

  // scenery
  const r = rng(def.name.length * 97);
  const near = (x, z, d) => { for (let i = 0; i < N; i += 3) { const dx = S[i].x - x, dz = S[i].z - z; if (dx * dx + dz * dz < d * d) return true; } return false; };
  const spots = [];
  for (let tries = 0; spots.length < 150 && tries < 4000; tries++) {
    const x = minX - 120 + r() * (maxX - minX + 240), z = minZ - 120 + r() * (maxZ - minZ + 240);
    if (!near(x, z, WALL + 6)) spots.push([x, z]);
  }
  const lolly = spots.filter((_, k) => k % 3 === 0), drops = spots.filter((_, k) => k % 3 === 1), cakes = spots.filter((_, k) => k % 3 === 2);
  const inst = (geo, mat, list, place) => { const m = new THREE.InstancedMesh(geo, mat, list.length); list.forEach((p, k) => { place(dummy, p, k); dummy.updateMatrix(); m.setMatrixAt(k, dummy.matrix); }); scene.add(m); return m; };
  const tint = (m, list, pick) => { list.forEach((_, k) => m.setColorAt(k, new THREE.Color(pick(k)))); };
  inst(new THREE.CylinderGeometry(0.35, 0.35, 9, 6), toon('#FFFFFF'), lolly, (d, [x, z], k) => { d.position.set(x, 4.5, z); d.rotation.set(0, 0, 0); d.scale.set(1, 1 + (k % 3) * 0.2, 1); });
  const heads = inst(new THREE.CylinderGeometry(3.4, 3.4, 0.9, 24), toon('#ffffff', { map: swirlTex }), lolly, (d, [x, z], k) => { d.position.set(x, 9.6 + (k % 3) * 1.8, z); d.rotation.set(Math.PI / 2, k * 1.3, 0); d.scale.set(1, 1, 1); });
  tint(heads, lolly, (k) => SPRINKLE[k % 5]);
  const gum = inst(new THREE.SphereGeometry(3, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2), toon('#ffffff'), drops, (d, [x, z], k) => { const s = 0.8 + (k % 4) * 0.35; d.position.set(x, 0, z); d.rotation.set(0, 0, 0); d.scale.set(s, s * 1.3, s); });
  tint(gum, drops, (k) => ['#FF6FAE', '#FFD45C', '#6EE3B9', '#7DBEFF', '#B48CFF', '#FF9E5E'][k % 6]);
  inst(new THREE.CylinderGeometry(3, 2.3, 3, 14), toon('#ffffff', { map: stripeTex }), cakes, (d, [x, z]) => { d.position.set(x, 1.5, z); d.rotation.set(0, 0, 0); d.scale.set(1, 1, 1); });
  const frost = inst(new THREE.SphereGeometry(3.3, 16, 10), toon('#ffffff'), cakes, (d, [x, z]) => { d.position.set(x, 3.6, z); d.scale.set(1, 0.7, 1); });
  tint(frost, cakes, (k) => ['#FFF0F6', '#FFC2DD', '#D7F7EA', '#FFF3C4'][k % 4]);
  inst(new THREE.SphereGeometry(0.6, 10, 8), toon('#E8233F'), cakes, (d, [x, z]) => { d.position.set(x, 6, z); d.scale.set(1, 1, 1); });
  // cotton-candy clouds
  const clouds = [];

function drawMinimap(x, y, w, h) {
  const b = track.bounds; const sc = Math.min(w / (b.maxX - b.minX + 40), h / (b.maxZ - b.minZ + 40));
  const cx = x + w / 2, cy = y + h / 2, mx = (b.minX + b.maxX) / 2, mz = (b.minZ + b.maxZ) / 2;
  const P = (p) => [cx + (p.x - mx) * sc, cy + (p.z - mz) * sc];
  ctx.lineWidth = Math.max(6, HALF * 2 * sc); ctx.strokeStyle = '#ffffffcc'; ctx.lineJoin = 'round'; ctx.beginPath();
  track.S.forEach((p, i) => { const [px, py] = P(p); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }); ctx.closePath(); ctx.stroke();
  for (const k of karts) { const [px, py] = P(k.pos); ctx.fillStyle = RACERS[k.racer].kart; ctx.beginPath(); ctx.arc(px, py, k.human >= 0 ? 7 : 5, 0, Math.PI * 2); ctx.fill(); if (k.human >= 0) { ctx.lineWidth = 2.5; ctx.strokeStyle = P_COLORS[k.human]; ctx.stroke(); } }
}

function drawRaceHud(s, [x, y, w, h]) {
  const k = s.kart; const u = Math.min(w, h * 1.6) / 22;
  // place
  const pc = ['#FFC83D', '#E6E6F0', '#FF9E5E'][k.place - 1] || '#FFFFFF';
  txt(PLACE[k.place - 1], x + w - u * 0.8, y + u * 1.6, u * 2.2, pc, 'right');
  // lap
  const lap = Math.min(settings.laps, Math.max(1, k.lap + 1));
  pill(x + u * 0.5, y + u * 0.5, u * 6.4, u * 1.6, '#5B1A4Acc');
  txt(`Lap ${lap}/${settings.laps}`, x + u * 3.7, y + u * 1.3, u * 0.95, '#fff', 'center', '#5B1A4A', 800);
  // item slot
  const ix = x + u * 1.9, iy = y + h - u * 1.9;
  ctx.fillStyle = '#ffffffdd'; ctx.beginPath(); ctx.arc(ix, iy, u * 1.3, 0, Math.PI * 2); ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = P_COLORS[k.human]; ctx.stroke();
  if (k.item) {
    const shown = k.rolling > 0 ? ['boost', 'gumball', 'taffy'][Math.floor(raceClock * 12) % 3] : k.item;
    drawItemIcon(shown, ix, iy, u * 0.9);
    if (k.rolling <= 0) txt(`${ITEM_NAME[k.item]} — press X`, ix + u * 1.7, iy, u * 0.65, '#fff', 'left', '#5B1A4A', 800);
  }
  // player label + speed boost flash
  txt(`P${k.human + 1} · ${RACERS[k.racer].name}${s.auto ? ' · Easy drive' : ''}`, x + w - u * 0.8, y + h - u * 0.9, u * 0.6, '#fff', 'right', P_COLORS[k.human], 800);
  if (k.boost > 0) txt('SPRINKLE BOOST!', x + w / 2, y + h * 0.78, u * 0.9, '#FFD23D');
  if (k.spin > 0) txt('Whoops!', x + w / 2, y + h * 0.4, u * 1.4, '#fff', 'center', '#E8233F');
  if (k.wrong > 1 && !k.finished) txt('↺  Turn around!', x + w / 2, y + h * 0.35, u * 1.3, '#fff', 'center', '#E8233F');
  if (countdown > 0) { const c = Math.ceil(countdown); txt(c > 3 ? '' : String(c), x + w / 2, y + h * 0.4, u * 4, '#fff', 'center', '#FF2E88'); }
  else if (raceClock < 1) txt('GO!', x + w / 2, y + h * 0.4, u * 4, '#FFD23D', 'center', '#FF2E88');
  if (k.finished) { ctx.fillStyle = '#5B1A4A88'; ctx.fillRect(x, y + h * 0.3, w, h * 0.25); txt(k.place === 1 ? 'You won! 🏁' : `You finished ${PLACE[k.place - 1]}!`, x + w / 2, y + h * 0.425, u * 1.6, '#fff', 'center', '#FF2E88'); }
}

function drawSelect() {
  ctx.clearRect(0, 0, SW, SH);
  const vps = viewports(4); // always show 4 slots on this screen
  const u = Math.min(SW, SH) / 36;
  for (let i = 0; i < 4; i++) {
    const [x, y, w, h] = vps[i]; const s = slots[i];
    ctx.lineWidth = 6; ctx.strokeStyle = s ? P_COLORS[i] : '#ffffff'; ctx.strokeRect(x + 6, y + 6, w - 12, h - 12);
    if (!s) {
      txt(`P${i + 1}`, x + w / 2, y + h * 0.38, u * 2.4, '#fff', 'center', '#E6A9C9');
      txt('Press  A  to join', x + w / 2, y + h * 0.56, u * 1.3, '#fff', 'center', '#FF4F9A');
      continue;
    }
    const r = RACERS[s.racer];
    txt(`P${i + 1}`, x + u * 1.2, y + u * 1.6, u * 1.3, '#fff', 'left', P_COLORS[i]);
    const cy = i < 2 ? y + h * 0.22 : y + h * 0.78; // top row: captions high; bottom row: low
    txt(r.name, x + w * 0.78, cy - u * 1.2, u * 1.7, r.kart, 'center', '#fff');
    txt('◀ stick ▶ pick', x + w * 0.78, cy + u * 0.3, u * 0.75, '#5B1A4A', 'center', '#fff', 800);
    txt(`Y: Easy drive ${s.auto ? 'ON' : 'off'}`, x + w * 0.78, cy + u * 1.3, u * 0.75, s.auto ? '#14B88A' : '#5B1A4A', 'center', '#fff', 800);
    txt('B: leave', x + w * 0.78, cy + u * 2.3, u * 0.7, '#5B1A4A', 'center', '#fff', 800);
  }
  // title & settings strip
  const bw = Math.min(SW * 0.8, 900), bh = u * 5.4, bx = (SW - bw) / 2, by = SH / 2 - bh / 2;
  pill(bx, by, bw, bh, '#ffffffee');
  txt('Sprinkle Sprint Racing', SW / 2, by + bh * 0.3, u * 1.9, '#FF2E88', 'center', '#fff');
  const t = TRACKS[settings.track];
  txt(`X: ${t.name}   ·   D-pad ▲▼: ${settings.laps} laps   ·   LB/RB: computer racers ${CPU_LEVELS[settings.cpu].name}`, SW / 2, by + bh * 0.58, u * 0.78, '#5B1A4A', 'center', '#fff', 800);
  txt(slots.length ? 'Everyone in? Press  ☰ MENU  to race!' : 'Grab a controller and press A', SW / 2, by + bh * 0.82, u * 0.95, '#9B5CFF', 'center', '#fff');
}

function drawResults() {
  ctx.clearRect(0, 0, SW, SH);
  const u = Math.min(SW, SH) / 30;
  txt(results[0].human >= 0 ? `P${results[0].human + 1} wins!` : `${RACERS[results[0].racer].name} wins!`, SW / 2, u * 2.2, u * 2.4, '#FFD23D', 'center', '#FF2E88');
  const bw = Math.min(560, SW * 0.6), x0 = (SW - bw) / 2, y0 = SH * 0.55;
  results.forEach((r, i) => {
    const y = y0 + i * u * 1.45;
    pill(x0, y - u * 0.6, bw, u * 1.2, r.human >= 0 ? '#ffffffee' : '#ffffff99');
    txt(PLACE[i], x0 + u * 0.6, y, u * 0.8, ['#FFC83D', '#B9B9D0', '#FF9E5E'][i] || '#5B1A4A', 'left', '#5B1A4A', 900);
    txt(`${RACERS[r.racer].name}${r.human >= 0 ? `  (P${r.human + 1})` : ''}`, x0 + u * 3.2, y, u * 0.8, RACERS[r.racer].kart, 'left', '#5B1A4A', 900);
    if (r.time) txt(`${r.time.toFixed(1)}s`, x0 + bw - u * 0.6, y, u * 0.7, '#5B1A4A', 'right', '#fff', 800);
  });
  txt('A: race again   ·   B: change racers', SW / 2, SH - u * 1.1, u * 0.9, '#fff', 'center', '#9B5CFF');
}

// ───────────────────────── Main loop ─────────────────────────
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  devices = readDevices();

  if (mode === 'select') {
    for (const id in devices.cur) {
      const h = devices.hit[id]; const slot = slots.find((s) => s.dev === id);
      if (!slot) { if (h.a && slots.length < 4) { slots.push({ dev: id, racer: freeRacer(slots.length), auto: false }); refreshGarage(); sfx.item(); } continue; }
      if (h.left || h.right) { slot.racer = freeRacer((slot.racer + (h.right ? 1 : -1) + 6) % 6, h.right ? 1 : -1); refreshGarage(); beep(520, 0.06); }
      if (h.y) { slot.auto = !slot.auto; beep(slot.auto ? 700 : 400, 0.08); }
      if (h.b) { slots.splice(slots.indexOf(slot), 1); refreshGarage(); beep(300, 0.1); }
      if (slot === slots[0]) {
        if (h.x) settings.track = (settings.track + 1) % TRACKS.length;
        if (h.up) settings.laps = Math.min(5, settings.laps + 1);
        if (h.down) settings.laps = Math.max(1, settings.laps - 1);
        if (h.lb) settings.cpu = Math.max(0, settings.cpu - 1);
        if (h.rb) settings.cpu = Math.min(2, settings.cpu + 1);
      }
      if (h.start) { startRace(); return; }
    }
    const vps = viewports(4);
    renderer.setScissor(0, 0, SW, SH); renderer.setViewport(0, 0, SW, SH); renderer.setClearColor('#FFD6EC'); renderer.clear();
    garageModels.forEach((g, i) => {
      g.root.rotation.y += dt * 0.8;
      garageCam.position.set(i * 30 + 0, 4.5, 11); garageCam.lookAt(i * 30, 1.6, 0);
      const [x, y, w, h] = vps[i]; const top = i < 2 ? y + 12 : y + h * 0.3; renderView(garage, garageCam, [x + 12, top, w * 0.58, h * 0.62], '#FFE3F2');
    });
    drawSelect();
    return;
  }

  if (mode === 'race') {
    for (const s of slots) if (devices.hit[s.dev]?.start) { paused = !paused; beep(paused ? 300 : 600, 0.1); }
    if (paused) {
      for (const s of slots) { const h = devices.hit[s.dev]; if (h?.a) paused = false; if (h?.b) { mode = 'select'; refreshGarage(); paused = false; return; } if (h?.y) { startRace(); return; } }
    } else updateRace(dt);
    const vps = viewports(slots.length);
    ctx.clearRect(0, 0, SW, SH);
    slots.forEach((s, i) => { chase(s, paused ? 0 : dt); renderView(scene, s.cam, vps[i]); });
    if (slots.length === 3) { const [x, y, w, h] = vps[3]; renderer.setViewport(x, SH - y - h, w, h); renderer.setScissor(x, SH - y - h, w, h); renderer.setClearColor('#FFD6EC'); renderer.clear(); }
    slots.forEach((s, i) => drawRaceHud(s, vps[i]));
    if (slots.length === 3) { const [x, y, w, h] = vps[3]; drawMinimap(x + 20, y + 20, w - 40, h - 40); }
    else { const m = Math.min(SW, SH) * 0.22; drawMinimap(slots.length === 1 ? SW - m - 20 : SW / 2 - m / 2, slots.length === 1 ? SH - m - 20 : SH / 2 - m / 2, m, m); }
    if (slots.length > 1) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, SH / 2 - 2, SW, 4); if (slots.length > 2) ctx.fillRect(SW / 2 - 2, 0, 4, SH); }
    if (paused) { ctx.fillStyle = '#5B1A4Aaa'; ctx.fillRect(0, 0, SW, SH); const u = Math.min(SW, SH) / 24; txt('Paused', SW / 2, SH * 0.4, u * 2.5, '#fff', 'center', '#FF2E88'); txt('A: keep racing   ·   Y: restart   ·   B: quit to racers', SW / 2, SH * 0.55, u, '#fff', 'center', '#9B5CFF'); }
    return;
  }

  if (mode === 'results') {
    for (const id in devices.hit) { const h = devices.hit[id]; if (!slots.some((s) => s.dev === id)) continue; if (h.a || h.start) { startRace(); return; } if (h.b) { mode = 'select'; refreshGarage(); return; } }
    garageModels.forEach((g) => (g.root.rotation.y += dt));
    garageCam.position.set(0, 6, 20); garageCam.lookAt(0, 2, 0);
    renderer.setScissor(0, 0, SW, SH); renderer.setViewport(0, 0, SW, SH); renderer.setClearColor('#FFD6EC'); renderer.clear();
    renderView(garage, garageCam, [0, SH * 0.08, SW, SH * 0.42], '#FFD6EC');
    drawResults();
  }
}
refreshGarage();
requestAnimationFrame(frame);
window.__game = { get mode() { return mode; }, slots, settings, get karts() { return karts; }, startRace };
</script>
